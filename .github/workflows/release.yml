name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag version"
        required: false
        default: ""

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.1.0'

    - name: Install NDK and CMake
      run: |
        SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
        if [ ! -x "$SDKMANAGER" ]; then
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -name sdkmanager -type f 2>/dev/null | head -n 1)"
        fi
        yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
        "$SDKMANAGER" "ndk;27.2.12479018" "cmake;3.22.1"

    - name: Cache native build
      uses: actions/cache@v4
      with:
        path: |
          llm/.cxx
          diffusion/.cxx
        key: native-${{ runner.os }}-${{ hashFiles('llm/src/main/cpp/**', 'llm/build.gradle.kts', 'diffusion/src/main/cpp/**', 'diffusion/build.gradle.kts') }}
        restore-keys: |
          native-${{ runner.os }}-

    - name: Build release APK
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
          export KEYSTORE_FILE=/tmp/release.keystore
        fi
        gradle assembleRelease assembleDebug --no-daemon --stacktrace 2>&1 | tee build-session.log

    - name: Publish compile evidence on failure
      if: failure()
      run: |
        set +e
        LOG=build-session.log
        if [ ! -f "$LOG" ]; then touch "$LOG"; fi
        errors=$(grep -E "^e: |error:|error C|fatal error|warning: unable|FAILURE|What went wrong|Execution failed|Caused by|CMake Error" "$LOG" | head -300)
        {
          echo "# Release build failure — captured $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo
          echo "Commit: $GITHUB_SHA"
          echo "Run URL: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          echo
          echo '```'
          echo "$errors"
          echo '```'
        } > release-report.md
        git config user.email "ci@github-actions.local"
        git config user.name "CI Report Bot"
        git fetch origin ci-report:ci-report 2>/dev/null || git branch -f ci-report HEAD
        git checkout ci-report 2>/dev/null || git checkout -b ci-report
        mkdir -p build
        cp release-report.md build/release-report.md
        git add build/release-report.md
        git commit -m "ci-report: release build failure evidence for $GITHUB_SHA" --allow-empty 2>/dev/null || true
        git push origin ci-report --force

    - name: Determine release tag
      id: tag
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag }}" ]; then
          echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
        else
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        fi

    - name: Get version info
      id: version
      run: |
        VERSION=$(echo "${{ steps.tag.outputs.tag }}" | sed 's/^v//')
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.tag }}
        name: AILLM ${{ steps.version.outputs.version }}
        body: |
          ## AILLM ${{ steps.version.outputs.version }}

          Local-first AI assistant for Android with long-term memory.

          ### Install
          Download and install the APK on your device. Allow installation from unknown sources.
        files: |
          app/build/outputs/apk/**/*.apk
        fail_on_unmatched_files: true
        draft: false
        prerelease: false
        generate_release_notes: false

    - name: Report build outputs
      if: always()
      run: |
        set +e
        {
          echo "# Release build outputs for $GITHUB_SHA"
          echo
          echo '## find app/build/outputs -name *.apk'
          find app/build/outputs -name '*.apk' 2>/dev/null
          echo
          echo '## any .apk in the workspace'
          find . -name '*.apk' -not -path './.git/*' 2>/dev/null
          echo
          echo '## app/build/outputs/apk tree'
          ls -laR app/build/outputs/apk 2>/dev/null
        } > build-outputs.txt
        git config user.email "ci@github-actions.local"
        git config user.name "CI Report Bot"
        git fetch origin ci-report:ci-report 2>/dev/null || git branch -f ci-report HEAD
        git checkout ci-report 2>/dev/null || git checkout -b ci-report
        mkdir -p build
        cp build-outputs.txt build/build-outputs.txt
        git add build/build-outputs.txt
        git commit -m "ci-report: release build outputs for $GITHUB_SHA" --allow-empty 2>/dev/null || true
        git push origin ci-report --force