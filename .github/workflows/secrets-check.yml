name: Secrets Check

# Manual sanity check: prints whether the release signing secrets exist,
# without ever printing their values. Run it from the Actions tab.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - name: Check release signing secrets
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        missing=0
        for s in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
          if [ -n "${!s}" ]; then
            echo "$s: set"
          else
            echo "$s: MISSING"
            missing=1
          fi
        done
        if [ "$missing" = "1" ]; then
          echo "::warning::Some secrets are missing (or were added as environment secrets). The APK falls back to debug signing."
        else
          echo "All release signing secrets are configured."
        fi
