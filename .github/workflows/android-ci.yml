name: Android CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # The :llm module compiles llama.cpp from source (NDK + CMake), which is the
    # slow part of this job. Compiling it is deliberate: on-device inference
    # needs token streaming, which a prebuilt AAR cannot provide.
    timeout-minutes: 180

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.1.0'

    - name: Install NDK and CMake
      run: |
        SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
        if [ ! -x "$SDKMANAGER" ]; then
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -name sdkmanager -type f 2>/dev/null | head -n 1)"
        fi
        yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
        "$SDKMANAGER" "ndk;27.2.12479018" "cmake;3.22.1"

    - name: Cache native build
      uses: actions/cache@v4
      with:
        path: |
          llm/.cxx
          diffusion/.cxx
        key: native-${{ runner.os }}-${{ hashFiles('llm/src/main/cpp/**', 'llm/build.gradle.kts', 'diffusion/src/main/cpp/**', 'diffusion/build.gradle.kts') }}
        restore-keys: |
          native-${{ runner.os }}-

    - name: Build Debug APK
      run: gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build-session.log

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: aillm-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30

    - name: Publish compile evidence on failure
      if: failure()
      run: |
        set +e
        LOG=build-session.log
        if [ ! -f "$LOG" ]; then touch "$LOG"; fi
        errors=$(grep -E "^e: |error:|warning: unable|FAILURE|What went wrong" "$LOG" | head -200)
        {
          echo "# CI build failure — captured $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo
          echo "Commit: $GITHUB_SHA"
          echo "Run URL: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          echo
          echo '```'
          echo "$errors"
          echo '```'
        } > ci-report.md
        git config user.email "ci@github-actions.local"
        git config user.name "CI Report Bot"
        git fetch origin ci-report:ci-report 2>/dev/null || git branch ci-report
        git checkout ci-report 2>/dev/null
        mkdir -p build
        cp ci-report.md build/ci-report.md
        git add build/ci-report.md
        git commit -m "ci-report: build failure evidence for $GITHUB_SHA" --allow-empty 2>/dev/null || true
        git push origin ci-report --force
