name: Android CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.1.0'

    - name: Build Debug APK
      id: build
      run: gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build-output.txt || true

    - name: Check result
      run: |
        if ls app/build/outputs/apk/debug/*.apk 2>/dev/null; then
          echo "BUILD SUCCEEDED"
        else
          echo "BUILD FAILED"
          echo "=== TAIL OF BUILD OUTPUT ==="
          tail -200 build-output.txt
          exit 1
        fi

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-output-log
        path: build-output.txt
        retention-days: 7

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: aillm-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30
