name: Android CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.1.0'

    - name: Build Debug APK
      id: build
      run: gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build-output.txt || true

    - name: Check for APK
      id: check
      run: |
        if ls app/build/outputs/apk/debug/*.apk 2>/dev/null; then
          echo "APK found"
          echo "build_ok=true" >> $GITHUB_OUTPUT
        else
          echo "APK NOT found - build failed"
          echo "build_ok=false" >> $GITHUB_OUTPUT
          echo ""
          echo "=== LAST 300 LINES OF BUILD OUTPUT ==="
          tail -300 build-output.txt
        fi

    - name: Fail if no APK
      if: steps.check.outputs.build_ok != 'true'
      run: exit 1

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: aillm-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30
