name: Android CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.1.0'

    - name: Build Debug APK
      id: build
      run: gradle assembleDebug --stacktrace 2>&1 | tee build-output.log; exit ${PIPESTATUS[0]}

    - name: Show build errors
      if: failure()
      run: |
        echo "=== BUILD OUTPUT (last 200 lines) ==="
        tail -200 build-output.log
      shell: bash

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: aillm-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30
