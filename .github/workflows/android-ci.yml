name: Android CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.1.0'

    - name: Build Debug APK
      id: build
      run: gradle assembleDebug --no-daemon --stacktrace > build-output.txt 2>&1 || true

    - name: Verify APK and surface errors
      id: verify
      run: |
        if ls app/build/outputs/apk/debug/*.apk >/dev/null 2>&1; then
          echo "BUILD SUCCEEDED"
        else
          echo "BUILD FAILED"
          grep -nE "e: |error:|FAILURE:|What went wrong|> Task .* FAILED" build-output.txt | head -25 | while IFS= read -r line; do
            echo "::error::$line"
          done
          exit 1
        fi

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: aillm-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30